<!doctype html>
<html lang="de" data-skin="papier" data-look="bento">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bunwichtig · Projekte</title>
<meta name="description" content="Kleine Webprojekte über Natur, Landschaft und Spiele – HTML, JavaScript und offene Daten.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23191714'/%3E%3Ctext x='50' y='72' font-size='66' text-anchor='middle' font-family='Georgia' font-style='italic' fill='%23f3efe6'%3Eb%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<script>
/* Optik und Farbe früh setzen, damit nichts aufblitzt */
try{
  var d=document.documentElement,q=new URLSearchParams(location.search);
  var s=q.get('farbe')||localStorage.getItem('ansicht'),l=q.get('optik')||localStorage.getItem('optik');
  if(s)d.dataset.skin=s; if(l)d.dataset.look=l;
  if(['moos','ton','tiefsee'].indexOf(d.dataset.skin)>-1)d.className='plast';
}catch(e){}
</script>
<style>
/* ===== Farben (gelten für Bento, Bühne, Feldbuch und Magazin) ===== */
[data-skin="papier"]{--bg:#f3efe6;--card:#f8f5ee;--well:#ebe4d6;--ink:#191714;--mut:#756e62;--line:#d6cdbd;--soft:#ebe4d6;--acc:#b5451b;--inv:#f3efe6;
  --f-disp:'Instrument Serif',Georgia,serif;--f-body:'Space Grotesk',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;--disp-w:400;--disp-track:-.03em}
[data-skin="nacht"]{--bg:#121411;--card:#171a16;--well:#1e221d;--ink:#ece7da;--mut:#8f8a7d;--line:#2b2e29;--soft:#1b1e1a;--acc:#c9a45c;--inv:#121411;
  --f-disp:'Instrument Serif',Georgia,serif;--f-body:'Space Grotesk',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;--disp-w:400;--disp-track:-.03em}
[data-skin="kalk"]{--bg:#f4f6f8;--card:#ffffff;--well:#eef2f6;--ink:#10233a;--mut:#5d6b7b;--line:#d5dbe2;--soft:#eef2f6;--acc:#1f5fa8;--inv:#fbfbf8;
  --f-disp:'Fraunces',Georgia,serif;--f-body:'IBM Plex Sans',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;--disp-w:400;--disp-track:-.035em}
[data-skin="moos"]{--bg:#e4e8df;--card:#eef1e9;--ink:#1f2a22;--mut:#66705f;--line:#d0d6c8;--soft:#e9ede4;--acc:#4f7a4a;--inv:#eef1e9;--well:#dfe4d8;
  --f-disp:'Instrument Serif',Georgia,serif;--f-body:'Space Grotesk',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;--disp-w:400;--disp-track:-.03em;
  --hi:rgba(255,255,255,.85);--sh:rgba(52,66,48,.28);--sh2:rgba(52,66,48,.12)}
[data-skin="ton"]{--bg:#e7dacb;--card:#f1e7da;--ink:#2b1d15;--mut:#7d6a5c;--line:#d8c8b5;--soft:#ece1d3;--acc:#b5562c;--inv:#f1e7da;--well:#e3d5c4;
  --f-disp:'Fraunces',Georgia,serif;--f-body:'IBM Plex Sans',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;--disp-w:400;--disp-track:-.035em;
  --hi:rgba(255,250,242,.9);--sh:rgba(90,55,30,.30);--sh2:rgba(90,55,30,.12)}
[data-skin="tiefsee"]{--bg:#0f171b;--card:#16232a;--ink:#e2ebe8;--mut:#8aa09b;--line:#22323a;--soft:#1a2830;--acc:#6fc3b2;--inv:#16232a;--well:#111c21;
  --f-disp:'Instrument Serif',Georgia,serif;--f-body:'Space Grotesk',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;--disp-w:400;--disp-track:-.03em;
  --hi:rgba(255,255,255,.06);--sh:rgba(0,0,0,.65);--sh2:rgba(0,0,0,.35)}

/* Optiken mit eigener, fester Farbwelt */
html[data-look="neon"]{--bg:#0b0816;--card:#140f26;--well:#0f0b1e;--ink:#f3eaff;--mut:#9a8fbf;--line:#2c2350;--soft:#1a1430;--acc:#ff3ea5;--acc2:#2ef2ff;--inv:#0b0816;
  --f-disp:'Press Start 2P',ui-monospace,monospace;--f-body:'Space Grotesk',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;--disp-w:400;--disp-track:0}
html[data-look="terminal"]{--bg:#0a0f0b;--card:#0d140f;--well:#0d140f;--ink:#b8f5c4;--mut:#5f8f69;--line:#1d3022;--soft:#112016;--acc:#ffd166;--inv:#0a0f0b;
  --f-disp:'JetBrains Mono',ui-monospace,monospace;--f-body:'JetBrains Mono',ui-monospace,monospace;--f-mono:'JetBrains Mono',ui-monospace,monospace;--disp-w:500;--disp-track:0}
html[data-look="pinnwand"]{--bg:#b88a5c;--card:#fffdf4;--well:#f3eedd;--ink:#2a2118;--mut:#6d5f4f;--line:#e2d8c0;--soft:#efe6cf;--acc:#c8352b;--inv:#fffdf4;
  --f-disp:'Caveat',cursive;--f-body:'Space Grotesk',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;--disp-w:700;--disp-track:0}

*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;transition:background .35s,color .35s}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(16px,3vw,32px)}
.mono{font:500 12px/1.4 var(--f-mono);text-transform:uppercase;letter-spacing:.09em}
em{font-style:italic}

/* Gemeinsame Bausteine */
nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0}
.logo{display:flex;align-items:center;gap:10px}
.logo i{font:italic 400 22px/1 'Instrument Serif',Georgia,serif;width:32px;height:32px;display:grid;place-items:center;background:var(--ink);color:var(--inv);border-radius:9px;text-transform:none}
.nav-r{display:flex;gap:22px;color:var(--mut)}
.nav-r a:hover{color:var(--ink)}
.cover{position:absolute;inset:0;z-index:1;border-radius:inherit}
.cover:focus-visible{outline:2px solid var(--acc);outline-offset:-3px}
.code{position:relative;z-index:2;border-bottom:1px solid currentColor;line-height:1.3;white-space:nowrap}
.code:hover{color:var(--acc)}
.st{color:var(--ink);white-space:nowrap}
.st:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:8px}
.art{border-radius:14px;background:var(--well);display:grid;place-items:center;overflow:hidden}
.art svg{width:100%;height:100%;display:block}
.art .a{stroke:var(--acc)}.art .i{stroke:var(--ink)}.art .f{fill:var(--acc)}
.play{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;background:var(--acc);color:var(--inv);font:600 15px/1 var(--f-body);white-space:nowrap}
.soon{opacity:.6}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0 40px;color:var(--mut)}
.hint{opacity:.12;margin-right:10px;transition:opacity .3s;text-transform:none}
.hint:hover,.hint:focus-visible{opacity:.7}

/* ===== Dezenter Optik-Umschalter (unten rechts) ===== */
.picker{position:fixed;right:16px;bottom:16px;z-index:50;font:500 11px/1.3 'JetBrains Mono',ui-monospace,monospace}
.picker>button{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--mut);border:1px solid var(--line);
  opacity:.45;transition:opacity .2s,transform .2s;box-shadow:0 4px 14px -6px rgba(0,0,0,.4)}
.picker>button:hover,.picker>button:focus-visible,.picker.open>button{opacity:1}
.picker>button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.picker .panel{position:absolute;right:0;bottom:46px;width:min(300px,calc(100vw - 32px));padding:14px;border-radius:16px;background:var(--card);color:var(--ink);border:1px solid var(--line);
  box-shadow:0 18px 50px -16px rgba(0,0,0,.5);display:none}
.picker.open .panel{display:block}
.panel h4{margin:0 0 8px;font:500 10px/1 'JetBrains Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--mut)}
.panel .looks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.panel button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;border:1px solid var(--line);color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.panel button:hover{color:var(--ink);border-color:var(--ink)}
.panel button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);background:var(--well);box-shadow:inset 0 -2px 0 var(--acc)}
.panel button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.panel .colors{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.panel .colors.off{opacity:.35;pointer-events:none}
.panel .pnote{margin:8px 0 0;color:var(--mut);font-size:10px;text-transform:none;letter-spacing:0}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid rgba(127,127,127,.45);position:relative;overflow:hidden;flex:none}
.sw:after{content:"";position:absolute;right:0;bottom:0;width:50%;height:50%}
.sw-papier{background:#f3efe6}.sw-papier:after{background:#b5451b}
.sw-nacht{background:#121411}.sw-nacht:after{background:#c9a45c}
.sw-kalk{background:#fbfbf8}.sw-kalk:after{background:#1f5fa8}
.sw-moos{background:#e4e8df}.sw-moos:after{background:#4f7a4a}
.sw-ton{background:#e7dacb}.sw-ton:after{background:#b5562c}
.sw-tiefsee{background:#0f171b}.sw-tiefsee:after{background:#6fc3b2}
.sw.r{border-radius:50%}

/* ===================== 1 · Bento-Raster ===================== */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(190px,auto);grid-auto-flow:dense;gap:14px;padding:6px 0 28px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0;padding:22px;border-radius:22px;background:var(--card);border:1px solid var(--line);
  overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s,background .35s}
.tile.big{grid-column:span 2;grid-row:span 2}
.tile.wide{grid-column:span 2}
.tile.link:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--ink) 40%,var(--line))}
.tile.link:hover .go{transform:translate(3px,-3px)}
.tile .art{flex:1;min-height:92px}
.tile .art svg{max-height:170px}
.tile.big .art svg{max-height:none}
.tile h2{font:var(--disp-w) clamp(28px,2.6vw,36px)/1 var(--f-disp);letter-spacing:-.01em;margin:0;padding-right:44px}
.tile.big h2{font-size:clamp(40px,4.4vw,64px);padding-right:0}
.tile .desc{margin:0;color:var(--mut);font-size:15px}
.tile.big .desc{font-size:16px;max-width:52ch}
.tile .play{align-self:flex-start}
.tile .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mut);font-size:11px}
.tile .tags{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tile .go{position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--card);color:var(--acc);border:1px solid var(--line);transition:transform .2s}
.tile .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--acc);color:var(--inv);font-size:10px}
.tile.soon{opacity:1}.tile.soon h2,.tile.soon .desc,.tile.soon .art{opacity:.6}
.b-hero{justify-content:space-between;background:var(--ink);color:var(--inv);border-color:var(--ink);padding:clamp(24px,3vw,36px)}
.b-hero h1{font:var(--disp-w) clamp(48px,6.4vw,92px)/.9 var(--f-disp);letter-spacing:var(--disp-track);margin:0}
.b-hero h1 em{color:var(--acc)}
.b-hero p{margin:0;max-width:44ch;color:color-mix(in srgb,var(--inv) 72%,var(--ink))}
.b-hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.b-hero .count{font:var(--disp-w) 56px/1 var(--f-disp)}
.b-hero .count small{display:block;font:500 11px/1.4 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;opacity:.6;margin-top:6px}
.tile.gh{justify-content:space-between}
.tile.gh h3{margin:0;font:var(--disp-w) 28px/1 var(--f-disp)}
.tile.gh p{margin:0;color:var(--mut);font-size:15px}
.plast .tile{border-color:transparent;box-shadow:inset 0 1px 0 var(--hi),0 2px 4px var(--sh2),0 22px 44px -22px var(--sh)}
.plast .tile.link:hover{border-color:transparent;box-shadow:inset 0 1px 0 var(--hi),0 4px 8px var(--sh2),0 32px 60px -24px var(--sh)}
.plast .b-hero{background:var(--card);color:var(--ink);box-shadow:inset 0 1px 0 var(--hi),inset 4px 0 0 var(--acc),0 4px 8px var(--sh2),0 30px 60px -24px var(--sh)}
.plast .b-hero p{color:var(--mut)}
.plast .art{box-shadow:inset 0 3px 8px var(--sh2),inset 0 -1px 0 var(--hi)}
.plast .tile .go{border-color:transparent;box-shadow:inset 0 1px 0 var(--hi),0 6px 14px -6px var(--sh)}

/* ===================== 2 · Spiele-Bühne ===================== */
.stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(20px,4vw,48px);align-items:center;padding:clamp(24px,4vw,48px);
  border-radius:28px;background:radial-gradient(120% 140% at 85% 20%,color-mix(in srgb,var(--c) 38%,transparent),transparent 60%),var(--ink);color:var(--inv);overflow:hidden}
.stage .kick{opacity:.7}
.stage h1{font:var(--disp-w) clamp(56px,8vw,120px)/.88 var(--f-disp);letter-spacing:var(--disp-track);margin:14px 0 16px}
.stage h1 em{color:var(--c)}
.stage p{margin:0 0 22px;max-width:46ch;opacity:.8;font-size:17px}
.stage .cta{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.stage .play{background:var(--c);color:#1a0f08;padding:15px 26px;font-size:17px}
.stage .tags{margin-top:22px;opacity:.6}
.stage .art{aspect-ratio:118/76;background:color-mix(in srgb,var(--inv) 8%,transparent);border-radius:20px;transform:rotate(-2deg);box-shadow:0 30px 60px -20px rgba(0,0,0,.6);transition:transform .4s}
.stage .art svg{color:var(--inv)!important}
.stage:hover .art{transform:rotate(0) scale(1.02)}
.stage .code{opacity:.8}
.s-intro{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;padding:40px 0 16px;border-bottom:1px solid var(--line)}
.s-intro h2{margin:0;font:var(--disp-w) clamp(32px,4vw,48px)/1 var(--f-disp);letter-spacing:var(--disp-track)}
.s-intro h2 em{color:var(--acc)}
.s-intro p{margin:0;color:var(--mut);max-width:48ch}
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:20px 0 36px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:14px 14px 18px;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:transform .25s}
.card.link:hover{transform:translateY(-4px)}
.card .art{aspect-ratio:16/10}
.card h3{margin:4px 4px 0;font:var(--disp-w) 26px/1.05 var(--f-disp)}
.card p{margin:0 4px;color:var(--mut);font-size:14px;flex:1}
.card .foot{display:flex;justify-content:space-between;gap:10px;margin:0 4px;font-size:10px;color:var(--mut)}
.plast .card{border-color:transparent;box-shadow:inset 0 1px 0 var(--hi),0 2px 4px var(--sh2),0 22px 44px -22px var(--sh)}

/* ===================== 3 · Feldbuch aufgefrischt ===================== */
.f-hero{display:grid;grid-template-columns:1fr 320px;gap:56px;align-items:end;padding:clamp(28px,5vw,64px) 0 clamp(32px,5vw,56px);border-top:1px solid var(--ink)}
.f-hero h1{font:var(--disp-w) clamp(56px,10vw,128px)/.88 var(--f-disp);letter-spacing:var(--disp-track);margin:0}
.f-hero h1 em{color:var(--acc)}
.f-hero p{margin:0;color:var(--mut)}
.f-hero .mono{margin-top:18px}
.rows{border-bottom:1px solid var(--line);margin-bottom:24px}
.row-p{position:relative;display:grid;grid-template-columns:64px 132px minmax(0,1fr) minmax(0,1.2fr) 190px 44px;gap:24px;align-items:center;padding:22px 16px;border-top:1px solid var(--line);border-radius:16px;transition:background .25s}
.row-p.link:hover{background:var(--soft)}
.row-p.link:hover .go{transform:translateX(4px)}
.row-p .num{font:var(--disp-w) 40px/1 var(--f-disp);color:var(--mut)}
.row-p .art{height:88px}
.row-p h2{font:var(--disp-w) clamp(30px,3.4vw,44px)/1 var(--f-disp);letter-spacing:-.01em;margin:0}
.row-p .desc{margin:0;color:var(--mut);font-size:15px}
.row-p .meta{font-size:11px;line-height:1.9}
.row-p .go{font-size:24px;text-align:right;color:var(--acc);transition:transform .2s}
.row-p.feat{background:var(--ink);color:var(--inv);border-top-color:var(--ink)}
.row-p.feat .num,.row-p.feat .desc{color:color-mix(in srgb,var(--inv) 70%,var(--ink))}
.row-p.feat .st{color:var(--inv)}
.row-p.feat .art{background:color-mix(in srgb,var(--inv) 10%,transparent)}
.row-p.feat .art svg{color:var(--inv)!important}
.row-p.feat:hover{background:var(--ink)}
.plast .row-p{border:0;background:var(--card);margin:14px 0;box-shadow:inset 0 1px 0 var(--hi),0 2px 4px var(--sh2),0 22px 44px -22px var(--sh)}
.plast .row-p.feat{background:var(--card);color:var(--ink);box-shadow:inset 0 1px 0 var(--hi),inset 4px 0 0 var(--acc),0 4px 8px var(--sh2),0 30px 60px -24px var(--sh)}
.plast .row-p.feat .num,.plast .row-p.feat .desc{color:var(--mut)}
.plast .row-p.feat .st{color:var(--ink)}
.plast .row-p.feat .art svg{color:var(--ink)!important}
.plast .rows{border:0}

/* ===================== 4 · Neon-Arcade ===================== */
[data-look="neon"] body{background:radial-gradient(80% 60% at 50% -10%,#3a1460 0,transparent 70%),linear-gradient(#0b0816,#0b0816)}
[data-look="neon"] body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);z-index:40}
[data-look="neon"] .logo i{background:var(--acc);color:#fff}
.n-hero{text-align:center;padding:clamp(28px,5vw,56px) 0 28px}
.n-hero h1{margin:0;font:400 clamp(22px,4.4vw,52px)/1.3 var(--f-disp);color:#fff;text-shadow:0 0 6px var(--acc),0 0 22px var(--acc),0 0 48px var(--acc)}
.n-hero p{margin:18px auto 0;max-width:52ch;color:var(--mut)}
.n-hero .blink{display:inline-block;margin-top:18px;font:400 12px/1 var(--f-disp);color:var(--acc2);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.cab{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center;padding:24px;border-radius:18px;border:2px solid var(--acc2);
  background:linear-gradient(160deg,#170f30,#0d0a1c);box-shadow:0 0 0 1px rgba(46,242,255,.2),0 0 28px rgba(46,242,255,.25),inset 0 0 40px rgba(46,242,255,.08)}
.cab .art{aspect-ratio:118/76;background:#05040b;border-radius:10px;border:1px solid #2c2350;box-shadow:inset 0 0 30px rgba(255,62,165,.18)}
.cab .art svg{color:#cfc2ff!important}
.cab h2{margin:0 0 14px;font:400 clamp(20px,2.6vw,32px)/1.3 var(--f-disp);color:#fff;text-shadow:0 0 10px var(--acc2)}
.cab p{margin:0 0 20px;color:#cfc4ec}
.cab .play{background:var(--acc);color:#fff;font:400 12px/1 var(--f-disp);padding:16px 20px;border-radius:6px;box-shadow:0 0 18px var(--acc)}
.cab .lvl{color:var(--acc2);margin-bottom:12px}
.cab .code,.ncard .code{color:var(--acc2)}
.ngrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:22px 0 36px}
.ncard{position:relative;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:14px;border:1px solid #3a2d6a;background:#110c22;transition:box-shadow .2s,border-color .2s,transform .2s}
.ncard.link:hover{border-color:var(--acc);box-shadow:0 0 20px rgba(255,62,165,.4);transform:translateY(-3px)}
.ncard .art{aspect-ratio:16/10;background:#07050f}
.ncard .art .a{stroke:var(--acc2)}.ncard .art .f{fill:var(--acc)}.ncard .art .i{stroke:#cfc2ff}
.ncard h3{margin:0;font:400 13px/1.5 var(--f-disp);color:#fff}
.ncard p{margin:0;color:var(--mut);font-size:14px;flex:1}
.ncard .lvl{color:var(--acc);font-size:10px}
.ncard .foot{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:var(--mut)}

/* ===================== 5 · Magazin ===================== */
.m-mast{text-align:center;padding:18px 0 10px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink)}
.m-mast h1{margin:0;font:400 clamp(56px,12vw,168px)/.9 'Fraunces',Georgia,serif;letter-spacing:-.045em}
.m-mast h1 em{color:var(--acc)}
.m-line{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line);color:var(--mut);font-size:11px}
.m-cover{position:relative;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);padding:32px 0;border-bottom:1px solid var(--ink)}
.m-cover .art{aspect-ratio:118/76;border-radius:4px}
.m-cover .kick{color:var(--acc)}
.m-cover h2{margin:10px 0 14px;font:400 clamp(44px,6vw,84px)/.92 'Fraunces',Georgia,serif;letter-spacing:-.035em}
.m-cover h2 em{color:var(--acc)}
.m-cover .lede{margin:0 0 16px;font:italic 400 22px/1.35 'Fraunces',Georgia,serif}
.m-cover .body{margin:0 0 22px;color:var(--mut);font-size:16px;max-width:46ch}
.m-cover .body:first-letter{float:left;font:400 58px/.8 'Fraunces',Georgia,serif;margin:6px 8px 0 0;color:var(--ink)}
.m-cover .cta{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.m-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 0 36px}
.m-art{position:relative;padding:24px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.m-art:last-child{border-right:0}
.m-art .art{aspect-ratio:16/10;border-radius:2px}
.m-art .kick{color:var(--acc);font-size:10px}
.m-art h3{margin:0;font:400 30px/1 'Fraunces',Georgia,serif;letter-spacing:-.02em}
.m-art.link:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.m-art p{margin:0;color:var(--mut);font-size:14px;flex:1}
.m-art .foot{font-size:10px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}

/* ===================== 6 · Terminal ===================== */
[data-look="terminal"] body{text-shadow:0 0 6px rgba(120,255,160,.25)}
[data-look="terminal"] .logo i{background:var(--ink);color:var(--bg);font-family:'JetBrains Mono',monospace;font-style:normal;font-size:16px;border-radius:4px}
.term{margin:8px 0 36px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.term .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--mut);font-size:12px}
.term .bar i{width:11px;height:11px;border-radius:50%;background:#3a4b3e;display:inline-block}
.term .scr{padding:clamp(16px,3vw,28px);font:14px/1.75 var(--f-mono);overflow-x:auto}
.term .pr{color:var(--acc)}
.term .dim{color:var(--mut)}
.term h1{margin:0 0 6px;font:500 clamp(22px,3.6vw,36px)/1.25 var(--f-mono);color:var(--ink)}
.term .ls{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:2px 22px;margin:8px 0 18px}
.term .ls>a,.term .ls>span{white-space:nowrap}
.term .ls .n{color:var(--acc);font-weight:500}
.term .ls a.n:hover{background:var(--acc);color:var(--bg);text-shadow:none}
.term .ls .d{white-space:normal;color:var(--ink)}
.term .feat{border:1px dashed var(--mut);padding:14px 16px;margin:6px 0 18px;border-radius:6px}
.term .feat a.go{display:inline-block;margin-top:8px;padding:2px 10px;background:var(--acc);color:var(--bg);text-shadow:none}
.term .cur{display:inline-block;width:.6em;height:1.1em;background:var(--ink);vertical-align:-3px;animation:blink 1s steps(1) infinite}

/* ===================== 7 · Pinnwand ===================== */
[data-look="pinnwand"] body{background:
  radial-gradient(circle at 20% 30%,rgba(0,0,0,.08) 0 1px,transparent 1.5px) 0 0/9px 9px,
  radial-gradient(circle at 70% 60%,rgba(255,255,255,.08) 0 1px,transparent 1.5px) 0 0/13px 13px,#b88a5c}
[data-look="pinnwand"] nav,[data-look="pinnwand"] footer{color:#2a2118}
[data-look="pinnwand"] footer,[data-look="pinnwand"] .nav-r{color:#4a3a2a}
.pw-hero{position:relative;max-width:640px;margin:16px auto 34px;padding:28px 34px;background:#fff8c9;transform:rotate(-1.2deg);box-shadow:0 18px 30px -18px rgba(0,0,0,.55)}
.pw-hero h1{margin:0;font:700 clamp(48px,7vw,84px)/.95 var(--f-disp);color:#2a2118}
.pw-hero h1 em{font-style:normal;color:var(--acc)}
.pw-hero p{margin:12px 0 0;color:#5a4a39}
.pins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 28px;padding:10px 0 48px;align-items:start}
.note{position:relative;display:flex;flex-direction:column;gap:10px;padding:26px 18px 18px;background:var(--card);box-shadow:0 16px 26px -16px rgba(0,0,0,.6),0 2px 3px rgba(0,0,0,.15);transition:transform .25s}
.note:before{content:"";position:absolute;top:-9px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,var(--c) 55%,#000 140%);box-shadow:0 3px 4px rgba(0,0,0,.4);z-index:2}
.note:nth-child(3n+1){transform:rotate(-1.6deg)}.note:nth-child(3n+2){transform:rotate(1.2deg)}.note:nth-child(3n){transform:rotate(-.4deg)}
.note.link:hover{transform:rotate(0) translateY(-4px)}
.note.feat{grid-column:span 2;grid-row:span 2;background:#fff8c9;padding:34px 26px 24px}
.note .art{aspect-ratio:16/10;border-radius:2px;background:#f1ead2}
.note.feat .art{aspect-ratio:118/76}
.note h3{margin:0;font:700 34px/1 var(--f-disp)}
.note.feat h3{font-size:clamp(48px,6vw,72px)}
.note h3 em{font-style:normal;color:var(--acc)}
.note p{margin:0;color:#5a4a39;font-size:15px}
.note .foot{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#7a6a58}
.note .play{align-self:flex-start;background:var(--acc);color:#fff}
.gh-note{background:#d8ecff}
.note.tape:after{content:"";position:absolute;top:-12px;right:22px;width:80px;height:26px;background:rgba(255,255,255,.55);transform:rotate(8deg)}

/* ===== Tablet & Handy ===== */
@media (max-width:980px){
  .bento{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile.big{grid-row:span 1}
  .tile.big .art{min-height:200px}
  .shelf,.ngrid,.m-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .m-art:nth-child(2n){border-right:0}
  .m-art{border-bottom:1px solid var(--line)}
  .row-p{grid-template-columns:48px 1fr 44px;gap:8px 14px}
  .row-p .num{font-size:30px;grid-row:1}
  .row-p h2{grid-column:2;grid-row:1}
  .row-p .go{grid-column:3;grid-row:1}
  .row-p .desc,.row-p .meta,.row-p .art{grid-column:2/4}
  .row-p .art{grid-row:2;height:140px}
  .pins{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .stage,.cab,.m-cover{grid-template-columns:minmax(0,1fr)}
  .stage .art,.cab .art{order:-1}
  .m-cover .body{columns:1}
  .f-hero{grid-template-columns:1fr;gap:20px}
}
@media (max-width:600px){
  .bento,.shelf,.ngrid,.m-grid,.pins{grid-template-columns:minmax(0,1fr)}
  .tile.big,.tile.wide,.note.feat{grid-column:auto}
  .tile{padding:18px;border-radius:18px}
  .m-art{border-right:0;padding:20px 0}
  .nav-r .opt{display:none}
  .logo{font-size:11px}
  .b-hero .count{font-size:44px}
  .term .ls{grid-template-columns:auto minmax(0,1fr)}
  .term .ls .x{display:none}
  .pw-hero{padding:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="wrap">
  <nav>
    <a class="logo mono" href="./"><i>b</i>bunwichtig — Werkverzeichnis</a>
    <div class="nav-r mono"><a class="opt" href="#projekte">Projekte</a><a href="https://github.com/bunwichtig">GitHub ↗</a></div>
  </nav>

  <main id="projekte"></main>

  <footer class="mono">
    <span><a class="hint" href="https://bunwichtig.github.io/architektur-onepager/" title="Architektur" aria-label="Architektur">◇</a>© <span id="year"></span> bunwichtig</span>
    <a href="https://github.com/bunwichtig">github.com/bunwichtig ↗</a>
  </footer>
</div>

<div class="picker" id="picker">
  <button type="button" aria-expanded="false" aria-controls="panel" title="Optik wählen" aria-label="Optik wählen">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>
  </button>
  <div class="panel" id="panel" role="dialog" aria-label="Optik und Farbe">
    <h4>Optik</h4>
    <div class="looks" id="looks"></div>
    <h4>Farbe</h4>
    <div class="colors" id="colors">
      <button type="button" data-s="papier"><span class="sw sw-papier"></span>Feldbuch</button>
      <button type="button" data-s="nacht"><span class="sw sw-nacht"></span>Nacht</button>
      <button type="button" data-s="kalk"><span class="sw sw-kalk"></span>Kalk</button>
      <button type="button" data-s="moos"><span class="sw r sw-moos"></span>Moos</button>
      <button type="button" data-s="ton"><span class="sw r sw-ton"></span>Ton</button>
      <button type="button" data-s="tiefsee"><span class="sw r sw-tiefsee"></span>Tiefsee</button>
    </div>
    <p class="pnote" id="cnote"></p>
  </div>
</div>

<script>
/* ── Projekte hier pflegen ──────────────────────────────
   Neues Projekt = neuer Eintrag. Felder:
   title, em (kursiver Teil des Namens, optional), text, color (Projektfarbe),
   art (Bild: walk | map | cam | signal | leaf | game),
   status, tags, live (Link zur Seite), repo (GitHub-Link),
   size: "big" (Hauptprojekt, groß) | "wide" (im Bento doppelt breit) | weglassen
   gross: true  → steht ganz vorne, natur: true → danach (Reihenfolge sonst wie hier)
   cta: Text für den Knopf beim Hauptprojekt (optional)
   Ohne live-Link gilt ein Projekt als „noch nicht verfügbar“ (blasser, nicht anklickbar).  */
const PROJECTS = [
  {
    title: "Funkenfeld",
    em: "feld",
    gross: true,
    size: "big",
    text: "Eigenes Bomben-Arena-Spiel für 2 bis 6 Leute direkt im Browser: Raum mit Passwort anlegen, Link schicken, losspielen. Klassisch oder individuell mit Mega-Items, Fernzünder, Sound und Rangliste.",
    color: "#e8742c",
    art: "game",
    status: "Spielbar",
    tags: ["Spiel", "Mehrspieler", "WebRTC"],
    cta: "Jetzt spielen",
    live: "https://bunwichtig.github.io/bombermannre/",
    repo: "https://github.com/bunwichtig/bombermannre"
  },
  {
    title: "Pure Nature",
    natur: true,
    size: "wide",
    text: "Ort suchen und sehen, welche Pflanzen, Tiere und Pilze dort vorkommen – mit Steckbriefen, Verbreitungsgebiet und einer Seite mit allen freien Datenquellen. Live aus offenen APIs.",
    color: "#4f7a4a",
    art: "map",
    status: "In Arbeit",
    tags: ["Karte", "GBIF", "iNaturalist"],
    live: "https://bunwichtig.github.io/naturewissen/",
    repo: "https://github.com/bunwichtig/naturewissen"
  },
  {
    title: "Nature BioDex",
    em: "BioDex",
    natur: true,
    text: "Prototyp eines Natur-Foto-Spiels: Tiere und Pflanzen fotografieren, bestimmen lassen, im Natur-Kodex sammeln und Medaillen freischalten.",
    color: "#b0703a",
    art: "cam",
    status: "Prototyp",
    tags: ["Spiel", "Fotografie"],
    live: "https://bunwichtig.github.io/nature/",
    repo: "https://github.com/bunwichtig/nature"
  },
  {
    title: "Pinnow Walk",
    text: "Begehbares 3D-Modell einer Seeuferlandschaft bei Pinnow: Gelände, Stege, Gebäude und Bäume aus offenen Geodaten von M-V. Mit Maus und Tastatur oder per Wischen am Handy erkunden.",
    color: "#3b6e8f",
    art: "walk",
    status: "In Arbeit",
    tags: ["3D", "three.js", "Geodaten"],
    live: "https://bunwichtig.github.io/pinnowwalk/",
    repo: "https://github.com/bunwichtig/pinnowwalk"
  },
  {
    title: "Unbekanntes Signal",
    em: "Signal",
    text: "Von weit draußen kommt etwas herein. Was es ist, wird noch nicht verraten.",
    color: "#8a8f99",
    art: "signal",
    status: "In Arbeit",
    tags: ["Raumschiffe", "Datenbank"],
    live: "https://bunwichtig.github.io/startrek-db/",
    repo: "https://github.com/bunwichtig/startrek-db"
  }
];
/* ─────────────────────────────────────────────────────── */

/* Optiken: eigene Farbwelt (fixed) oder mit den sechs Farben kombinierbar */
const LOOKS = [
  { id: 'bento',    name: 'Bento' },
  { id: 'buehne',   name: 'Bühne' },
  { id: 'feldbuch', name: 'Feldbuch' },
  { id: 'neon',     name: 'Neon-Arcade', fixed: true },
  { id: 'magazin',  name: 'Magazin' },
  { id: 'terminal', name: 'Terminal', fixed: true },
  { id: 'pinnwand', name: 'Pinnwand', fixed: true }
];
const SKINS = ['papier','nacht','kalk','moos','ton','tiefsee'];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm = p => p.em ? esc(p.title).replace(esc(p.em), `<em>${esc(p.em)}</em>`) : esc(p.title);
const tags = p => (p.tags || []).map(esc).join(' · ');
const cover = (p, verb = 'ansehen') => p.live ? `<a class="cover" href="${esc(p.live)}" aria-label="${esc(p.title)} ${verb}"></a>` : '';
const code = p => p.repo ? `<a class="code" href="${esc(p.repo)}">Code ↗</a>` : '';
const cls = p => p.live ? 'link' : 'soon';
const sty = p => `style="--c:${esc(p.color || '#777')}"`;
const n2 = i => String(i + 1).padStart(2, '0');

/* Spielfeld-Motiv für Funkenfeld: Raster mit festen Blöcken, Kisten, Bombe, Flammenkreuz, Figuren */
function gameArt(){
  const c = 26, cols = 11, rows = 7, ox = 3, oy = 3;
  const cx = x => ox + x * c + c / 2, cy = y => oy + y * c + c / 2;
  let s = '';
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const px = ox + x * c, py = oy + y * c;
    const edge = x === 0 || y === 0 || x === cols - 1 || y === rows - 1;
    if (edge || (x % 2 === 0 && y % 2 === 0)) s += `<rect x="${px+1}" y="${py+1}" width="${c-2}" height="${c-2}" rx="5" fill="currentColor" opacity=".16"/>`;
    else if ([[3,1],[7,1],[8,3],[1,4],[5,5],[9,5],[3,5]].some(([a,b]) => a === x && b === y))
      s += `<rect x="${px+3}" y="${py+3}" width="${c-6}" height="${c-6}" rx="4" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/>`;
  }
  const fx = cx(5), fy = cy(3), d = `M${cx(3)} ${fy} H${cx(7)} M${fx} ${cy(1)} V${cy(5)}`;
  s += `<g stroke-linecap="round" fill="none"><path d="${d}" stroke="#e8742c" stroke-width="18" opacity=".55"/><path d="${d}" stroke="#ffb547" stroke-width="10"/><path d="${d}" stroke="#fff4d6" stroke-width="4"/></g>`;
  const bx = cx(7), by = cy(5);
  s += `<circle cx="${bx}" cy="${by+1}" r="9" fill="currentColor" opacity=".85"/><path d="M${bx+5} ${by-6} q4 -5 8 -3" stroke="currentColor" stroke-width="1.6" fill="none" opacity=".85"/><circle cx="${bx+13}" cy="${by-9}" r="2.6" fill="#ffb547"/>`;
  [[1,1,'#e8742c'],[9,1,'#3b8fd9'],[1,5,'#4fae5b']].forEach(([x,y,col]) =>
    s += `<circle cx="${cx(x)}" cy="${cy(y)}" r="8.5" fill="${col}"/><circle cx="${cx(x)-3}" cy="${cy(y)-2}" r="1.6" fill="#fff"/><circle cx="${cx(x)+3}" cy="${cy(y)-2}" r="1.6" fill="#fff"/>`);
  return `<svg viewBox="0 0 ${cols*c+6} ${rows*c+6}" preserveAspectRatio="xMidYMid meet" style="color:var(--ink);padding:10px">${s}</svg>`;
}

const ART = {
  walk: '<svg viewBox="0 0 120 84" fill="none" stroke-width="1"><path class="a" d="M0 60 C25 50 45 56 60 48 S95 40 120 46"/><path class="a" d="M0 68 C25 58 47 63 62 56 S96 49 120 54"/><path class="a" d="M0 76 C25 67 50 70 64 64 S97 58 120 62"/><path class="i" d="M50 48 h14 v-9 h-14z M48 40 l9-7 l9 7"/><path class="i" d="M70 58 l14 2" stroke-width="2"/></svg>',
  map:  '<svg viewBox="0 0 120 84" fill="none"><circle class="a" cx="60" cy="42" r="10"/><circle class="a" cx="60" cy="42" r="22" stroke-opacity=".6"/><circle class="a" cx="60" cy="42" r="34" stroke-opacity=".3"/><circle class="f" cx="60" cy="42" r="3"/></svg>',
  cam:  '<svg viewBox="0 0 120 84" fill="none" stroke-width="1.2"><path class="i" d="M42 26 h-8 v8 M78 26 h8 v8 M42 58 h-8 v-8 M78 58 h8 v-8"/><circle class="a" cx="60" cy="42" r="8"/><circle class="f" cx="60" cy="42" r="2"/></svg>',
  signal: '<svg viewBox="0 0 120 84" fill="none" stroke-linecap="round"><circle class="f" cx="40" cy="42" r="2.6"/><path class="a" d="M47 34 A11 11 0 0 1 47 50" stroke-width="1.3"/><path class="a" d="M54 26 A22 22 0 0 1 54 58" stroke-width="1.2" stroke-opacity=".7"/><path class="a" d="M61 18 A33 33 0 0 1 61 66" stroke-width="1.1" stroke-opacity=".45"/><path class="a" d="M68 10 A44 44 0 0 1 68 74" stroke-opacity=".25"/></svg>',
  leaf: '<svg viewBox="0 0 120 84" fill="none"><path class="a" d="M60 70 C60 46 46 32 32 28 C52 24 60 38 60 52 C60 38 74 22 92 24 C78 32 60 46 60 70Z"/></svg>',
  game: gameArt()
};
ART.mapWide = ART.map.replace('viewBox="0 0 120 84"', 'viewBox="-60 0 240 84"').replace('<circle class="f"', '<circle class="a" cx="60" cy="42" r="46" stroke-opacity=".15"/><circle class="f"');
const art = (p, wide) => `<div class="art" aria-hidden="true">${(wide && p.art === 'map') ? ART.mapWide : (ART[p.art] || ART.leaf)}</div>`;

const rank = p => p.gross ? 0 : p.natur ? 1 : 2;
const LIST = PROJECTS.map((p, i) => ({ p, i })).sort((a, b) => rank(a.p) - rank(b.p) || a.i - b.i).map(x => x.p);
const FEAT = LIST.find(p => p.size === 'big') || LIST[0];
const REST = LIST.filter(p => p !== FEAT);
const H1 = 'Feldnotizen<br>aus dem <em>Browser.</em>';
const INTRO = 'Kleine Webprojekte über Natur, Landschaft und ab und zu ein Spiel – gebaut mit HTML, JavaScript und offenen Daten. Kein Server, keine Datenbank, alles nachvollziehbar.';
const MONTH = new Date().toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });

/* ── Die sieben Optiken ── */
const RENDER = {
  bento() {
    /* Unter der großen Reihe: freie Zellen der letzten Zeile mit breiteren Kacheln füllen */
    const sizes = new Map(LIST.map(p => [p, p.size]));
    const small = LIST.filter(p => p.size !== 'big');
    let free = (4 - (small.reduce((n, p) => n + (p.size === 'wide' ? 2 : 1), 0) + 2) % 4) % 4;
    for (let i = small.length - 1; i >= 0 && free > 0; i--) if (!small[i].size) { sizes.set(small[i], 'wide'); free--; }
    const t = p => {
      const big = p.size === 'big', size = sizes.get(p);
      return `<article class="tile ${cls(p)}${size ? ' ' + esc(size) : ''}" ${sty(p)}>
        ${cover(p, big ? 'spielen' : 'ansehen')}
        ${big ? `<div class="top"><span class="badge mono">Neu</span><span class="st mono">${esc(p.status)}</span></div>` : `<span class="go" aria-hidden="true">${p.live ? '↗' : '…'}</span>`}
        ${art(p, size === 'wide')}
        <h2>${nm(p)}</h2>
        <p class="desc">${esc(p.text)}</p>
        ${big && p.live ? `<span class="play">${esc(p.cta || 'Öffnen')} →</span>` : ''}
        <div class="foot mono">${big ? '' : `<span class="st">${esc(p.status)}</span>`}<span class="tags">${tags(p)}</span>${code(p)}</div>
      </article>`;
    };
    return `<div class="bento">
      <header class="tile big b-hero"><h1>${H1}</h1>
        <div class="row"><p>${INTRO}</p><div class="count">${PROJECTS.length}<small>Projekte</small></div></div></header>
      ${LIST.map(t).join('')}
      <section class="tile wide gh link"><a class="cover" href="https://github.com/bunwichtig" aria-label="Alle Projekte auf GitHub"></a>
        <span class="go" aria-hidden="true">↗</span><h3>Quelltext</h3>
        <p>Alles liegt offen auf GitHub – zum Nachlesen, Nachbauen und Mitmachen.</p><span class="mono">github.com/bunwichtig</span></section>
    </div>`;
  },

  buehne() {
    const p = FEAT;
    return `<section class="stage" ${sty(p)}>${cover(p, 'spielen')}
        <div><span class="mono kick">Neu · ${esc(p.status)}</span><h1>${nm(p)}</h1><p>${esc(p.text)}</p>
          <div class="cta">${p.live ? `<span class="play">${esc(p.cta || 'Öffnen')} →</span>` : ''}<span class="mono">${code(p)}</span></div>
          <div class="mono tags">${tags(p)}</div></div>
        ${art(p)}
      </section>
      <div class="s-intro"><h2>Feldnotizen aus dem <em>Browser.</em></h2><p>${INTRO}</p></div>
      <div class="shelf">${REST.map(q => `<article class="card ${cls(q)}" ${sty(q)}>${cover(q)}${art(q)}
        <h3>${nm(q)}</h3><p>${esc(q.text)}</p>
        <div class="foot mono"><span class="st">${esc(q.status)}</span>${code(q)}</div></article>`).join('')}</div>`;
  },

  feldbuch() {
    return `<header class="f-hero"><h1>${H1}</h1><div><p>${INTRO}</p><div class="mono">Natur · Daten · Spiele · Code</div></div></header>
      <div class="rows">${LIST.map((p, i) => `<article class="row-p ${cls(p)}${p === FEAT ? ' feat' : ''}" ${sty(p)}>${cover(p)}
        <span class="num">${n2(i)}</span>${art(p)}<h2>${nm(p)}</h2><p class="desc">${esc(p.text)}</p>
        <div class="meta mono"><span class="st">${esc(p.status)}</span><br>${tags(p)}${p.repo ? '<br>' + code(p) : ''}</div>
        <span class="go" aria-hidden="true">${p.live ? '→' : '…'}</span></article>`).join('')}</div>`;
  },

  neon() {
    const p = FEAT;
    return `<header class="n-hero"><h1>BUNWICHTIG<br>ARCADE</h1><p>${INTRO}</p><span class="blink">▶ PRESS START</span></header>
      <section class="cab" ${sty(p)}>${cover(p, 'spielen')}${art(p)}
        <div><div class="mono lvl">★ Spieler 1 · ${esc(p.status)}</div><h2>${esc(p.title).toUpperCase()}</h2><p>${esc(p.text)}</p>
          <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">${p.live ? `<span class="play">${esc((p.cta || 'Start').toUpperCase())} ▶</span>` : ''}<span class="mono">${code(p)}</span></div></div>
      </section>
      <div class="ngrid">${REST.map((q, i) => `<article class="ncard ${cls(q)}" ${sty(q)}>${cover(q)}
        <span class="mono lvl">Level ${n2(i + 1)}</span>${art(q)}<h3>${esc(q.title).toUpperCase()}</h3><p>${esc(q.text)}</p>
        <div class="foot mono"><span>${esc(q.status)}</span>${code(q)}</div></article>`).join('')}</div>`;
  },

  magazin() {
    const p = FEAT, words = p.text.split(': ');
    return `<header class="m-mast"><h1>bunwich<em>tig</em></h1></header>
      <div class="m-line mono"><span>Feldnotizen aus dem Browser</span><span>Ausgabe ${MONTH}</span><span>${PROJECTS.length} Projekte</span></div>
      <article class="m-cover ${cls(p)}" ${sty(p)}>${cover(p, 'spielen')}${art(p)}
        <div><span class="mono kick">Titelgeschichte · ${esc(p.status)}</span><h2>${nm(p)}</h2>
          <p class="lede">${esc(words[0])}.</p><p class="body">${esc(words.slice(1).join(': ') || p.text)}</p>
          <div class="cta">${p.live ? `<span class="play">${esc(p.cta || 'Öffnen')} →</span>` : ''}<span class="mono">${code(p)}</span></div></div>
      </article>
      <div class="m-grid">${REST.map(q => `<article class="m-art ${cls(q)}" ${sty(q)}>${cover(q)}
        <span class="mono kick">${esc((q.tags || [])[0] || q.status)}</span>${art(q)}<h3>${nm(q)}</h3><p>${esc(q.text)}</p>
        <div class="foot mono"><span class="st">${esc(q.status)}</span>${code(q)}</div></article>`).join('')}</div>`;
  },

  terminal() {
    const p = FEAT, slug = q => (q.live || q.repo || '').replace(/\/$/, '').split('/').pop() || q.title.toLowerCase();
    return `<div class="term"><div class="bar"><i></i><i></i><i></i><span>bunwichtig@github: ~</span></div><div class="scr">
      <div><span class="pr">$</span> cat liesmich.txt</div>
      <h1>Feldnotizen aus dem Browser.</h1><div class="dim">${INTRO}</div><br>
      <div><span class="pr">$</span> ./${esc(slug(p))} --spieler 2-6</div>
      <div class="feat"><b>${esc(p.title)}</b> <span class="dim">[${esc(p.status)}]</span><br>${esc(p.text)}<br>
        ${p.live ? `<a class="go" href="${esc(p.live)}">▶ ${esc(p.cta || 'öffnen')}</a>` : ''} ${p.repo ? `<a class="dim" href="${esc(p.repo)}">quelltext ↗</a>` : ''}</div>
      <div><span class="pr">$</span> ls -l ~/projekte</div>
      <div class="ls">${LIST.map(q => `<span class="dim x">drwxr-xr-x</span>${q.live ? `<a class="n" href="${esc(q.live)}">${esc(slug(q))}/</a>` : `<span class="n">${esc(slug(q))}/</span>`}<span class="d">${esc(q.title)} <span class="dim">– ${tags(q)}</span></span><span class="dim x">${esc(q.status)}</span>`).join('')}</div>
      <div><span class="pr">$</span> <span class="cur"></span></div>
    </div></div>`;
  },

  pinnwand() {
    return `<header class="pw-hero"><h1>Feldnotizen aus dem <em>Browser!</em></h1><p>${INTRO}</p></header>
      <div class="pins">${LIST.map((p, i) => {
        const f = p === FEAT;
        return `<article class="note ${cls(p)}${f ? ' feat' : ''}${i % 3 === 2 ? ' tape' : ''}" ${sty(p)}>${cover(p, f ? 'spielen' : 'ansehen')}
          ${art(p)}<h3>${nm(p)}</h3><p>${esc(p.text)}</p>
          ${f && p.live ? `<span class="play">${esc(p.cta || 'Öffnen')} →</span>` : ''}
          <div class="foot mono"><span class="st">${esc(p.status)}</span>${code(p)}</div></article>`;
      }).join('')}
      <article class="note link gh-note" style="--c:#3b6e8f"><a class="cover" href="https://github.com/bunwichtig" aria-label="Alle Projekte auf GitHub"></a>
        <h3>Quelltext ↗</h3><p>Alles liegt offen auf GitHub – zum Nachlesen, Nachbauen und Mitmachen.</p><div class="foot mono"><span>github.com/bunwichtig</span></div></article></div>`;
  }
};

/* ── Umschalten ── */
const root = document.documentElement, main = document.getElementById('projekte');
const picker = document.getElementById('picker'), toggle = picker.querySelector(':scope>button');
document.getElementById('looks').innerHTML = LOOKS.map(l => `<button type="button" data-l="${l.id}">${esc(l.name)}</button>`).join('');
const lookBtns = picker.querySelectorAll('[data-l]'), skinBtns = picker.querySelectorAll('[data-s]');

function apply(look, skin) {
  if (!RENDER[look]) look = 'bento';
  if (!SKINS.includes(skin)) skin = 'papier';
  const L = LOOKS.find(l => l.id === look);
  root.dataset.look = look;
  root.dataset.skin = skin;
  root.classList.toggle('plast', !L.fixed && ['moos','ton','tiefsee'].includes(skin));
  main.innerHTML = RENDER[look]();
  lookBtns.forEach(b => b.setAttribute('aria-pressed', b.dataset.l === look));
  skinBtns.forEach(b => b.setAttribute('aria-pressed', b.dataset.s === skin));
  document.getElementById('colors').classList.toggle('off', !!L.fixed);
  document.getElementById('cnote').textContent = L.fixed ? `${L.name} hat eine eigene Farbwelt.` : '';
  try { localStorage.setItem('optik', look); localStorage.setItem('ansicht', skin); } catch (e) {}
}
lookBtns.forEach(b => b.onclick = () => apply(b.dataset.l, root.dataset.skin));
skinBtns.forEach(b => b.onclick = () => apply(root.dataset.look, b.dataset.s));
const open = v => { picker.classList.toggle('open', v); toggle.setAttribute('aria-expanded', v); };
toggle.onclick = e => { e.stopPropagation(); open(!picker.classList.contains('open')); };
document.addEventListener('click', e => { if (!picker.contains(e.target)) open(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { open(false); toggle.focus(); } });

document.getElementById('year').textContent = new Date().getFullYear();
apply(root.dataset.look, root.dataset.skin);
</script>
</body>
</html>
