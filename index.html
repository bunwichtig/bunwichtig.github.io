<!doctype html>
<html lang="de" data-v="6">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bunwichtig · Projekte</title>
<meta name="description" content="Kleine Webprojekte über Natur, Landschaft und Spiele – HTML, JavaScript und offene Daten.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23111110'/%3E%3Ctext x='50' y='71' font-size='62' text-anchor='middle' font-family='Arial' font-weight='700' fill='%23fff'%3Eb%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script>
/* Design früh setzen, damit nichts aufblitzt */
try{
  var v=new URLSearchParams(location.search).get('design')||localStorage.getItem('design');
  if(/^[1-6]$/.test(v))document.documentElement.dataset.v=v;
}catch(e){}
</script>
<style>
/* ===================== Die sechs Designs: Farben und Schriften ===================== */
/* 1 · Bento – hell, klar, Kacheln */
[data-v="1"]{--bg:#f6f6f3;--surface:#fff;--well:#f0efea;--ink:#111110;--mut:#6c6b66;--line:#e5e3dc;--acc:#e8742c;--on-acc:#fff;--seg:#ecebe5;
  --r:24px;--f:'Inter',system-ui,sans-serif;--fd:'Inter',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,monospace}
/* 2 · Aurora – dunkel, Glas, Farbverlauf */
[data-v="2"]{color-scheme:dark;--bg:#07070c;--surface:rgba(255,255,255,.035);--well:rgba(255,255,255,.04);--ink:#f4f4f7;--mut:#9a9aab;--line:rgba(255,255,255,.09);--acc:#a78bfa;--on-acc:#0b0716;--seg:rgba(255,255,255,.05);
  --r:22px;--f:'Inter',system-ui,sans-serif;--fd:'Inter',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,monospace;--grad:linear-gradient(100deg,#a78bfa,#22d3ee 50%,#f472b6)}
/* 3 · Brutal – kräftige Farben, dicke Rahmen, harte Schatten */
[data-v="3"]{--bg:#fff3dc;--surface:#fff;--well:#fff;--ink:#111;--mut:#3d3d3d;--line:#111;--acc:#ff5c39;--on-acc:#111;--seg:#fff;--hl:#ffd23f;
  --r:14px;--f:'Space Grotesk',system-ui,sans-serif;--fd:'Space Grotesk',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,monospace}
/* 4 · Swiss – große Schrift, Raster, eine Akzentfarbe */
[data-v="4"]{--bg:#efefec;--surface:transparent;--well:#e2e2de;--ink:#0d0d0d;--mut:#66665f;--line:#0d0d0d;--acc:#ff3b00;--on-acc:#fff;--seg:transparent;
  --r:0px;--f:'Inter',system-ui,sans-serif;--fd:'Inter',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,monospace}
/* 5 · Glas – helle Pastell-Verläufe, mattes Glas */
[data-v="5"]{--bg:#f4f1fb;--surface:rgba(255,255,255,.58);--well:rgba(255,255,255,.55);--ink:#1b1530;--mut:#625b78;--line:rgba(255,255,255,.85);--acc:#7c3aed;--on-acc:#fff;--seg:rgba(255,255,255,.5);
  --r:28px;--f:'Plus Jakarta Sans',system-ui,sans-serif;--fd:'Plus Jakarta Sans',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,monospace;--grad:linear-gradient(100deg,#7c3aed,#db2777)}
/* 6 · Bühne – dunkel, Hauptprojekt im Rampenlicht, Karten zum Wischen */
[data-v="6"]{color-scheme:dark;--bg:#0e0e10;--surface:#18181b;--well:#202024;--ink:#f6f5f2;--mut:#9b9a96;--line:#2a2a2f;--acc:#f6f5f2;--on-acc:#0e0e10;--seg:#18181b;
  --r:26px;--f:'Inter',system-ui,sans-serif;--fd:'Bricolage Grotesque',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,monospace}

/* ===================== Grundgerüst ===================== */
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f);-webkit-font-smoothing:antialiased;min-height:100vh;position:relative}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(16px,3vw,32px)}
.mono{font:500 11px/1.4 var(--fm);text-transform:uppercase;letter-spacing:.09em}
#projekte{position:relative;z-index:1;padding-bottom:40px}

/* Kopfzeile: Logo · Kategorien · Design 1–6 */
.bar{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid transparent}
.bar .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding-top:14px;padding-bottom:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.01em;justify-self:start}
.logo i{font-style:normal;font-weight:700;width:32px;height:32px;display:grid;place-items:center;background:var(--ink);color:var(--bg);border-radius:10px}
.logo span{color:var(--mut);font-weight:500}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--seg);border:1px solid var(--line)}
.seg a{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;color:var(--mut);font-weight:500;font-size:14px;white-space:nowrap;transition:background .2s,color .2s}
.seg a:hover{color:var(--ink)}
.seg a small{font:500 11px/1 var(--fm);padding:3px 7px;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.seg a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.seg a[aria-current="page"] small{background:color-mix(in srgb,var(--bg) 22%,transparent)}
.seg a:focus-visible,.vs button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.vs{display:flex;align-items:center;gap:4px;justify-self:end}
.vs>span{color:var(--mut);margin-right:6px}
.vs button{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);color:var(--mut);font:600 13px/1 var(--f);transition:background .2s,color .2s,border-color .2s}
.vs button:hover{color:var(--ink);border-color:var(--ink)}
.vs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Gemeinsame Bausteine */
.cover{position:absolute;inset:0;z-index:1;border-radius:inherit}
.cover:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.code{position:relative;z-index:2;color:var(--mut);border-bottom:1px solid currentColor;line-height:1.3;white-space:nowrap}
.code:hover{color:var(--ink)}
.st{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.st:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.art{background:var(--well);display:grid;place-items:center;overflow:hidden}
.art svg{width:100%;height:100%;display:block}
.art .a{stroke:var(--c)}.art .i{stroke:var(--ink)}.art .f{fill:var(--c)}
.btn{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;padding:12px 20px;border-radius:999px;background:var(--acc);color:var(--on-acc);font:600 15px/1 var(--f);white-space:nowrap;transition:gap .2s}
.link:hover .btn{gap:14px}
.soon{opacity:.6}
.leer{padding:80px 0;color:var(--mut);text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--mut);font-size:13px;font-weight:500}
.eyebrow b{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}

/* Karte (in allen Designs gleich aufgebaut, nur anders gestaltet) */
.c{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s}
.c .art{aspect-ratio:16/10;border-radius:calc(var(--r) - 8px);margin:8px 8px 0}
.c-b{display:flex;flex-direction:column;gap:8px;padding:16px 20px 20px;flex:1}
.c-meta{display:flex;justify-content:space-between;gap:10px;font:500 11px/1.4 var(--fm);text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.c h3{margin:2px 0 0;font:700 24px/1.1 var(--fd);letter-spacing:-.025em}
.c h3 em{font-style:normal;color:var(--c)}
.c p{margin:0;color:var(--mut);font-size:15px;flex:1}
.c .btn{margin-top:6px}
.c-f{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px;font:500 11px/1.4 var(--fm);text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.c-f .tags{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c .go{position:absolute;top:18px;right:18px;z-index:0;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--line);
  backdrop-filter:blur(8px);font-size:16px;transition:transform .3s,background .3s,color .3s}
.c.link:hover{transform:translateY(-4px)}
.c.link:hover .go{transform:rotate(45deg);background:var(--ink);color:var(--bg)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin:56px 0 18px}
.sec-h h2{margin:0;font:700 clamp(26px,3vw,36px)/1 var(--fd);letter-spacing:-.03em}
.sec-h p{margin:0;color:var(--mut);max-width:46ch}

/* Sanftes Einblenden beim Wechseln */
@keyframes in{from{opacity:0;transform:translateY(10px)}}
#projekte .c,#projekte .row,#projekte .hero,#projekte .spot{animation:in .5s cubic-bezier(.2,.8,.2,1) both}
#projekte .grid>:nth-child(2),#projekte .bento>:nth-child(2),#projekte .shelf>:nth-child(2){animation-delay:.04s}
#projekte .grid>:nth-child(3),#projekte .bento>:nth-child(3),#projekte .shelf>:nth-child(3){animation-delay:.08s}
#projekte .grid>:nth-child(4),#projekte .bento>:nth-child(4),#projekte .shelf>:nth-child(4){animation-delay:.12s}
#projekte .grid>:nth-child(n+5),#projekte .bento>:nth-child(n+5),#projekte .shelf>:nth-child(n+5){animation-delay:.16s}

footer{position:relative;z-index:1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:24px 0 40px;color:var(--mut);border-top:1px solid var(--line)}
footer a:hover{color:var(--ink)}
.hint{opacity:.15;margin-right:10px;transition:opacity .3s}
.hint:hover,.hint:focus-visible{opacity:.7}

/* ===================== 1 · Bento ===================== */
[data-v="1"] .bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(200px,auto);grid-auto-flow:dense;gap:14px;padding:12px 0 8px}
[data-v="1"] .bento .big{grid-column:span 2;grid-row:span 2}
[data-v="1"] .bento .wide{grid-column:span 2}
[data-v="1"] .bento .c .art{aspect-ratio:auto;flex:1;min-height:130px}
[data-v="1"] .bento .c .art svg{max-height:200px}
[data-v="1"] .bento .big .art{min-height:240px}
[data-v="1"] .bento .big .art svg{max-height:none}
[data-v="1"] .bento .c-b{flex:0}
[data-v="1"] .bento .big h3{font-size:clamp(36px,3.6vw,52px);letter-spacing:-.04em}
[data-v="1"] .c.link:hover{box-shadow:0 1px 2px rgba(0,0,0,.04),0 24px 48px -24px rgba(0,0,0,.25)}
[data-v="1"] .hero{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:clamp(24px,3vw,36px);border-radius:var(--r);background:var(--ink);color:var(--bg);overflow:hidden}
[data-v="1"] .hero:after{content:"";position:absolute;width:420px;height:420px;right:-160px;top:-180px;border-radius:50%;background:radial-gradient(circle,rgba(232,116,44,.55),transparent 65%);pointer-events:none}
[data-v="1"] .hero h1{position:relative;margin:0;font:800 clamp(40px,5.2vw,72px)/.95 var(--fd);letter-spacing:-.05em}
[data-v="1"] .hero h1 em{font-style:normal;color:var(--acc)}
[data-v="1"] .hero p{margin:0;max-width:42ch;color:rgba(255,255,255,.66)}
[data-v="1"] .hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
[data-v="1"] .hero .count{font:800 56px/1 var(--fd);letter-spacing:-.04em}
[data-v="1"] .hero .count small{display:block;font:500 11px/1.4 var(--fm);text-transform:uppercase;letter-spacing:.1em;opacity:.55;margin-top:6px}
[data-v="1"] .hero .eyebrow{align-self:flex-start;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:rgba(255,255,255,.8)}
[data-v="1"] .gh{justify-content:space-between;padding:22px;background:var(--well)}
[data-v="1"] .gh h3{margin:0}
[data-v="1"] .gh p{flex:0}

/* ===================== 2 · Aurora ===================== */
[data-v="2"] body:before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(60px);opacity:.9;
  background:radial-gradient(40% 35% at 20% 10%,rgba(124,58,237,.45),transparent 70%),radial-gradient(35% 30% at 85% 15%,rgba(34,211,238,.28),transparent 70%),radial-gradient(40% 40% at 60% 90%,rgba(244,114,182,.22),transparent 70%)}
[data-v="2"] body:after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:56px 56px;
  -webkit-mask-image:radial-gradient(70% 60% at 50% 0,#000,transparent);mask-image:radial-gradient(70% 60% at 50% 0,#000,transparent)}
[data-v="2"] .bar{border-bottom-color:var(--line)}
[data-v="2"] .logo i{background:var(--grad);color:#0b0716}
[data-v="2"] .seg a[aria-current="page"],[data-v="2"] .vs button[aria-pressed="true"]{background:#fff;color:#0b0716;border-color:#fff}
[data-v="2"] .hero{text-align:center;padding:clamp(48px,9vw,110px) 0 clamp(36px,6vw,64px);display:flex;flex-direction:column;align-items:center;gap:22px}
[data-v="2"] .hero h1{margin:0;font:700 clamp(44px,7.4vw,104px)/.95 var(--fd);letter-spacing:-.055em;max-width:12ch}
[data-v="2"] .hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-v="2"] .hero p{margin:0;max-width:56ch;color:var(--mut);font-size:18px}
[data-v="2"] .eyebrow{backdrop-filter:blur(10px)}
[data-v="2"] .c{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
[data-v="2"] .c.link:hover{border-color:rgba(167,139,250,.5);box-shadow:0 0 0 1px rgba(167,139,250,.25),0 30px 80px -30px rgba(167,139,250,.55)}
[data-v="2"] .c .art{background:radial-gradient(80% 90% at 50% 100%,color-mix(in srgb,var(--c) 22%,transparent),transparent),rgba(255,255,255,.025);border:1px solid var(--line)}
[data-v="2"] .feat{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);margin-bottom:16px}
[data-v="2"] .feat .art{aspect-ratio:auto;min-height:320px;margin:10px}
[data-v="2"] .feat .c-b{padding:clamp(22px,3vw,40px);justify-content:center;gap:12px}
[data-v="2"] .feat h3{font-size:clamp(40px,4.6vw,64px);letter-spacing:-.05em}
[data-v="2"] .feat p{flex:0;font-size:16px}
[data-v="2"] .btn{background:var(--grad);color:#0b0716;box-shadow:0 10px 30px -10px rgba(167,139,250,.7)}

/* ===================== 3 · Brutal ===================== */
[data-v="3"] .bar{background:var(--bg);border-bottom:2.5px solid var(--ink)}
[data-v="3"] .logo{font-weight:700}
[data-v="3"] .logo i{border-radius:8px;background:var(--acc);color:var(--ink);border:2px solid var(--ink)}
[data-v="3"] .seg{border:2.5px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);padding:3px}
[data-v="3"] .seg a{border-radius:8px;color:var(--ink);font-weight:700}
[data-v="3"] .seg a[aria-current="page"]{background:var(--hl);color:var(--ink)}
[data-v="3"] .seg a[aria-current="page"] small{background:var(--ink);color:#fff}
[data-v="3"] .vs button{border:2px solid var(--ink);color:var(--ink);border-radius:8px;background:#fff}
[data-v="3"] .vs button[aria-pressed="true"]{background:var(--acc);color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
[data-v="3"] .hero{position:relative;padding:clamp(36px,6vw,72px) 0 clamp(28px,4vw,44px)}
[data-v="3"] .hero h1{margin:0;font:700 clamp(48px,9vw,128px)/.9 var(--fd);letter-spacing:-.05em;text-transform:uppercase}
[data-v="3"] .hero h1 em{font-style:normal;background:var(--hl);padding:0 .12em;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);display:inline-block;transform:rotate(-1.5deg);margin-top:.08em}
[data-v="3"] .hero h1{padding-right:150px}
[data-v="3"] .hero p{margin:28px 0 0;max-width:52ch;font-size:18px;font-weight:500}
[data-v="3"] .sticker{position:absolute;right:0;top:clamp(30px,5vw,60px);width:130px;height:130px;border-radius:50%;background:var(--acc);border:2.5px solid var(--ink);display:grid;place-items:center;text-align:center;
  font:700 15px/1.1 var(--fd);text-transform:uppercase;transform:rotate(12deg);box-shadow:4px 4px 0 var(--ink)}
[data-v="3"] .c{border:2.5px solid var(--ink);box-shadow:6px 6px 0 var(--ink);transition:transform .15s,box-shadow .15s}
[data-v="3"] .c.link:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}
[data-v="3"] .c .art{margin:0;border-radius:0;border-bottom:2.5px solid var(--ink);background:color-mix(in srgb,var(--c) 30%,#fff)}
[data-v="3"] .c .art .i{stroke:var(--ink)}[data-v="3"] .c .art .a{stroke:var(--ink);stroke-width:2}[data-v="3"] .c .art .f{fill:var(--ink)}
[data-v="3"] .c h3{font-size:28px;text-transform:uppercase;letter-spacing:-.03em}
[data-v="3"] .c h3 em{color:inherit;background:var(--hl);padding:0 4px}
[data-v="3"] .c p{color:var(--mut)}
[data-v="3"] .c .go{border:2px solid var(--ink);background:#fff;border-radius:10px}
[data-v="3"] .c.link:hover .go{transform:none;background:var(--hl);color:var(--ink)}
[data-v="3"] .c-meta,[data-v="3"] .c-f{color:var(--ink)}
[data-v="3"] .st:before{border:1.5px solid var(--ink);box-shadow:none;width:9px;height:9px}
[data-v="3"] .code{color:var(--ink)}
[data-v="3"] .btn{border-radius:10px;border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);color:var(--ink);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
[data-v="3"] .g3 .span2{grid-column:span 2;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
[data-v="3"] .g3 .span2 .art{aspect-ratio:auto;min-height:280px;border-bottom:0;border-right:2.5px solid var(--ink)}
[data-v="3"] .g3 .span2 h3{font-size:clamp(36px,4vw,56px)}
[data-v="3"] .g3 .span2 .c-b{padding:24px;justify-content:center}
[data-v="3"] .g3 .span2 p{flex:0}
[data-v="3"] .grid{gap:24px}
[data-v="3"] footer{border-top:2.5px solid var(--ink);color:var(--ink)}

/* ===================== 4 · Swiss ===================== */
[data-v="4"] .logo i{border-radius:0;background:var(--acc);color:#fff}
[data-v="4"] .seg{border:0;padding:0;gap:18px;border-radius:0}
[data-v="4"] .seg a{padding:6px 0;border-radius:0;font-weight:600}
[data-v="4"] .seg a[aria-current="page"]{background:none;color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)}
[data-v="4"] .seg a[aria-current="page"] small{background:var(--acc);color:#fff}
[data-v="4"] .vs button{border-radius:0;border-color:transparent}
[data-v="4"] .vs button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
[data-v="4"] .bar{border-bottom-color:var(--ink)}

/* Spielfeld-Motiv für Funkenfeld: Raster mit festen Blöcken, Kisten, Bombe, Flammenkreuz, Figuren */
function gameArt(){
  const c = 26, cols = 11, rows = 7, ox = 3, oy = 3;
  const cx = x => ox + x * c + c / 2, cy = y => oy + y * c + c / 2;
  let s = '';
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const px = ox + x * c, py = oy + y * c;
    const edge = x === 0 || y === 0 || x === cols - 1 || y === rows - 1;
    if (edge || (x % 2 === 0 && y % 2 === 0)) s += `<rect x="${px+1}" y="${py+1}" width="${c-2}" height="${c-2}" rx="5" fill="currentColor" opacity=".16"/>`;
    else if ([[3,1],[7,1],[8,3],[1,4],[5,5],[9,5],[3,5]].some(([a,b]) => a === x && b === y))
      s += `<rect x="${px+3}" y="${py+3}" width="${c-6}" height="${c-6}" rx="4" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/>`;
  }
  const fx = cx(5), fy = cy(3), d = `M${cx(3)} ${fy} H${cx(7)} M${fx} ${cy(1)} V${cy(5)}`;
  s += `<g stroke-linecap="round" fill="none"><path d="${d}" stroke="#e8742c" stroke-width="18" opacity=".55"/><path d="${d}" stroke="#ffb547" stroke-width="10"/><path d="${d}" stroke="#fff4d6" stroke-width="4"/></g>`;
  const bx = cx(7), by = cy(5);
  s += `<circle cx="${bx}" cy="${by+1}" r="9" fill="currentColor" opacity=".85"/><path d="M${bx+5} ${by-6} q4 -5 8 -3" stroke="currentColor" stroke-width="1.6" fill="none" opacity=".85"/><circle cx="${bx+13}" cy="${by-9}" r="2.6" fill="#ffb547"/>`;
  [[1,1,'#e8742c'],[9,1,'#3b8fd9'],[1,5,'#4fae5b']].forEach(([x,y,col]) =>
    s += `<circle cx="${cx(x)}" cy="${cy(y)}" r="8.5" fill="${col}"/><circle cx="${cx(x)-3}" cy="${cy(y)-2}" r="1.6" fill="#fff"/><circle cx="${cx(x)+3}" cy="${cy(y)-2}" r="1.6" fill="#fff"/>`);
  return `<svg viewBox="0 0 ${cols*c+6} ${rows*c+6}" preserveAspectRatio="xMidYMid meet" style="color:var(--ink);padding:10px">${s}</svg>`;
}

  signal: '<svg viewBox="0 0 120 84" fill="none" stroke-linecap="round"><circle class="f" cx="40" cy="42" r="2.6"/><path class="a" d="M47 34 A11 11 0 0 1 47 50" stroke-width="1.3"/><path class="a" d="M54 26 A22 22 0 0 1 54 58" stroke-width="1.2" stroke-opacity=".7"/><path class="a" d="M61 18 A33 33 0 0 1 61 66" stroke-width="1.1" stroke-opacity=".45"/><path class="a" d="M68 10 A44 44 0 0 1 68 74" stroke-opacity=".25"/></svg>',
  krater: '<svg viewBox="0 0 120 84" fill="none" stroke-linecap="round"><path class="a" d="M22 54 Q44 10 74 48" stroke-dasharray="2 4" stroke-width="1.3"/><path class="i" d="M0 66 C14 60 22 58 30 60 C40 62 46 60 54 62 C60 64 62 72 70 72 C78 72 80 62 88 60 C100 58 110 62 120 58"/><path class="i" d="M30 60 v-6 M26 54 a4 3 0 0 1 8 0z" stroke-width="1.2"/><circle class="f" cx="74" cy="48" r="2.4"/><path class="a" d="M70 44 l-3 -3 M78 44 l3 -3 M74 42 v-4" stroke-width="1.1"/></svg>',
  leaf: '<svg viewBox="0 0 120 84" fill="none"><path class="a" d="M60 70 C60 46 46 32 32 28 C52 24 60 38 60 52 C60 38 74 22 92 24 C78 32 60 46 60 70Z"/></svg>',
  game: gameArt()
};
ART.mapWide = ART.map.replace('viewBox="0 0 120 84"', 'viewBox="-60 0 240 84"').replace('<circle class="f"', '<circle class="a" cx="60" cy="42" r="46" stroke-opacity=".15"/><circle class="f"');
const art = (p, wide) => `<div class="art" aria-hidden="true">${(wide && p.art === 'map') ? ART.mapWide : (ART[p.art] || ART.leaf)}</div>`;

const rank = p => p.gross ? 0 : p.natur ? 1 : 2;
const ALL = PROJECTS.map((p, i) => ({ p, i })).sort((a, b) => rank(a.p) - rank(b.p) || a.i - b.i).map(x => x.p);

/* Kategorien: #spiele oder #daten in der Adresse zeigt nur diese Projekte */
const KATS = { spiele: 'Spiele', daten: 'Daten' };
let KAT = '', LIST = ALL, FEAT, REST;
function filter(k) {
  KAT = KATS[k] ? k : '';
  LIST = KAT ? ALL.filter(p => p.kat === KAT) : ALL;
  FEAT = LIST.find(p => p.size === 'big') || LIST[0];
  REST = LIST.filter(p => p !== FEAT);
}
filter(location.hash.slice(1));
const H1 = 'Feldnotizen aus dem <em>Browser.</em>';
const INTRO = 'Kleine Webprojekte über Natur, Landschaft und ab und zu ein Spiel – gebaut mit HTML, JavaScript und offenen Daten. Kein Server, keine Datenbank, alles nachvollziehbar.';
const MONTH = new Date().toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
const label = () => KAT ? KATS[KAT] : 'Projekte';
const eyebrow = () => `<span class="eyebrow"><b></b>${LIST.length} ${label()} · Natur, Daten, Spiele</span>`;

/* Eine Karte – in allen Designs gleich aufgebaut, die Gestaltung macht das CSS */
function card(p, o = {}) {
  const big = !!o.cta;
  return `<article class="c ${cls(p)}${o.k ? ' ' + o.k : ''}" ${sty(p)}>${cover(p, big ? 'spielen' : 'ansehen')}
    ${art(p, o.wide)}
    <div class="c-b">
      <div class="c-meta"><span class="st">${esc(p.status)}</span><span>${KATS[p.kat] || ''}</span></div>
      <h3>${nm(p)}</h3><p>${esc(p.text)}</p>
      ${big && p.live ? `<span class="btn">${esc(p.cta || 'Öffnen')} <span aria-hidden="true">→</span></span>` : ''}
      <div class="c-f"><span class="tags">${tags(p)}</span>${code(p)}</div>
    </div>
    ${big ? '' : `<span class="go" aria-hidden="true">${p.live ? '↗' : '…'}</span>`}
  </article>`;
}
const grid = (list, k, o) => list.length ? `<div class="grid ${k}">${list.map(p => card(p, o)).join('')}</div>` : '';

/* ── Die sechs Designs ── */
const DESIGNS = { 1: 'Bento', 2: 'Aurora', 3: 'Brutal', 4: 'Swiss', 5: 'Glas', 6: 'Bühne' };
const RENDER = {
  1() {
    /* Bento: freie Zellen der letzten Zeile mit breiteren Kacheln füllen */
    const sizes = new Map(LIST.map(p => [p, p.size]));
    const small = LIST.filter(p => p.size !== 'big');
    let free = (4 - (small.reduce((n, p) => n + (p.size === 'wide' ? 2 : 1), 0) + 2) % 4) % 4;
    for (let i = small.length - 1; i >= 0 && free > 0; i--) if (!small[i].size) { sizes.set(small[i], 'wide'); free--; }
    return `<div class="bento">
      <header class="hero big">${eyebrow()}<h1>${H1}</h1>
        <div class="row"><p>${INTRO}</p><div class="count">${LIST.length}<small>${label()}</small></div></div></header>
      ${LIST.map(p => card(p, { k: sizes.get(p), cta: p.size === 'big', wide: sizes.get(p) === 'wide' })).join('')}
      <section class="c wide gh link"><a class="cover" href="https://github.com/bunwichtig" aria-label="Alle Projekte auf GitHub"></a>
        <span class="go" aria-hidden="true">↗</span><h3>Quelltext</h3>
        <p>Alles liegt offen auf GitHub – zum Nachlesen, Nachbauen und Mitmachen.</p><span class="mono">github.com/bunwichtig</span></section>
    </div>`;
  },

  2() {
    return `<section class="hero">${eyebrow()}<h1>${H1}</h1><p>${INTRO}</p></section>
      ${card(FEAT, { k: 'feat', cta: true })}
      ${grid(REST, 'g2')}`;
  },

  3() {
    return `<section class="hero"><h1>Feldnotizen aus dem <em>Browser!</em></h1><p>${INTRO}</p>
        ${FEAT.live ? `<a class="sticker" href="${esc(FEAT.live)}">Neu:<br>${esc(FEAT.title)}</a>` : ''}</section>
      <div class="grid g3">${card(FEAT, { k: 'span2', cta: true })}${REST.map(p => card(p)).join('')}</div>`;
  },

  4() {
    return `<section class="hero"><div class="k mono"><span>Werkverzeichnis</span><span>${MONTH}</span></div>
        <h1>${H1}</h1><div><p>${INTRO}</p><div class="count">${String(LIST.length).padStart(2, '0')}<small>${label()}</small></div></div></section>
      <ol class="rows">${LIST.map((p, i) => `<li class="row ${cls(p)}${p === FEAT ? ' top' : ''}" ${sty(p)}>${cover(p)}
        <span class="n">${n2(i)}</span><h3>${nm(p)}</h3><p>${esc(p.text)}</p>
        <div class="meta"><span class="st">${esc(p.status)}</span><span>${tags(p)}</span>${code(p) ? `<span>${code(p)}</span>` : ''}</div>
        ${art(p)}<span class="go" aria-hidden="true">${p.live ? '→' : '…'}</span></li>`).join('')}</ol>`;
  },

  5() {
    const n = k => ALL.filter(p => p.kat === k).length;
    return `<section class="hero"><div>${eyebrow()}<h1>${H1}</h1><p>${INTRO}</p>
          <div class="stats"><div><b>${ALL.length}</b><span>Projekte</span></div><div><b>${n('spiele')}</b><span>Spiele</span></div><div><b>${n('daten')}</b><span>Daten</span></div></div></div>
        ${card(FEAT, { cta: true })}</section>
      ${REST.length ? `<div class="sec-h"><h2>Alle ${label()}</h2><p>Offen auf GitHub, direkt im Browser.</p></div>` : ''}
      ${grid(REST, 'g4')}`;
  },

  6() {
    const p = FEAT;
    return `<section class="spot ${cls(p)}" ${sty(p)}>${cover(p, 'spielen')}
        <div><span class="eyebrow">Neu · ${esc(p.status)}</span><h1>${nm(p)}</h1><p>${esc(p.text)}</p>
          <div class="cta">${p.live ? `<span class="btn">${esc(p.cta || 'Öffnen')} →</span>` : ''}<span class="mono">${code(p)}</span></div>
          <div class="mono tags">${tags(p)}</div></div>
        ${art(p)}
      </section>
      ${REST.length ? `<div class="sec-h"><h2>Weitere ${label()}</h2><p>${INTRO}</p></div>
      <div class="shelf">${REST.map(q => card(q)).join('')}</div>` : ''}`;
  }
};

/* ── Umschalten ── */
const root = document.documentElement, main = document.getElementById('projekte');
const katNav = document.getElementById('kats'), vs = document.getElementById('vs');
katNav.innerHTML = [['alle', 'Alle', ALL.length], ...Object.entries(KATS).map(([k, n]) => [k, n, ALL.filter(p => p.kat === k).length])]
  .map(([k, n, c]) => `<a href="#${k}">${n}<small>${c}</small></a>`).join('');
vs.insertAdjacentHTML('beforeend', Object.entries(DESIGNS).map(([v, n]) =>
  `<button type="button" data-d="${v}" title="Design ${v} · ${n}" aria-label="Design ${v}: ${n}">${v}</button>`).join(''));
const katLinks = katNav.querySelectorAll('a'), vBtns = vs.querySelectorAll('button');

function apply(v) {
  if (!RENDER[v]) v = '6';
  root.dataset.v = v;
  main.innerHTML = LIST.length ? RENDER[v]() : '<p class="leer mono">Hier ist noch nichts.</p>';
  katLinks.forEach(a => a.hash.slice(1) === (KAT || 'alle') ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  vBtns.forEach(b => b.setAttribute('aria-pressed', b.dataset.d === v));
  try { localStorage.setItem('design', v); } catch (e) {}
}
vBtns.forEach(b => b.onclick = () => apply(b.dataset.d));
/* Tasten 1–6 wechseln das Design */
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || /input|textarea|select/i.test(e.target.tagName)) return;
  if (RENDER[e.key]) apply(e.key);
});
addEventListener('hashchange', () => { filter(location.hash.slice(1)); apply(root.dataset.v); });

document.getElementById('year').textContent = new Date().getFullYear();
apply(root.dataset.v);
</script>
</body>
</html>
